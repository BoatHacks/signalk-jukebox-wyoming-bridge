name: CI
on:
  push: { branches: ["**"] }
  pull_request: { branches: ["**"] }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm ci
      - run: npm test

  # Build-only, no push -- catches a broken Dockerfile (a bad snapclient
  # asset URL, a missing apt package, ...) on every PR, not just on
  # release when build-image in publish.yml runs for real.
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
