name: publish
on: { release: { types: [published] } }
permissions:
  contents: read
  id-token: write # enables npm OIDC trusted publishing
  packages: write # enables pushing the container image to ghcr.io
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm ci
      - run: npm test
      - run: npm publish

  # Keeps ghcr.io/boathacks/signalk-jukebox-wyoming-bridge tracking the npm
  # package's own version in tandem, same convention as signalk-jukebox's
  # own publish.yml: every release rebuilds and pushes the image, tagged
  # with :latest (the tag "auto" in signalk-jukebox's wyomingBridges
  # settings resolves to, wyoming-bridge.ts's resolveTag) AND the
  # release's own version number, so a build is never left stale behind a
  # release and there's always a version-pinned image to roll back to.
  build-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Derive the image version from the release tag (strip the leading "v")
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/boathacks/signalk-jukebox-wyoming-bridge:latest
            ghcr.io/boathacks/signalk-jukebox-wyoming-bridge:${{ steps.version.outputs.version }}
